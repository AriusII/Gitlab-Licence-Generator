name: GitLab EE license builder

on:
  workflow_dispatch:
    inputs:
      gitlab_version:
        description: GitLab EE version tag to match when extracting the feature set (for example 19.3.0)
        required: true
        default: '19.3.0'
      license_name:
        description: License holder name
        required: true
        default: 'Tim Cook'
      license_company:
        description: License holder company
        required: true
        default: 'Apple Computer, Inc.'
      license_email:
        description: License holder email
        required: true
        default: 'tcook@apple.com'
      license_plan:
        description: GitLab plan to generate
        type: choice
        required: true
        default: ultimate
        options:
          - ultimate
          - premium
          - starter
      license_user_count:
        description: Active user count
        required: true
        default: '2147483647'
      license_expire_year:
        description: Expiry year
        required: true
        default: '2500'
      deploy:
        description: Deploy the generated keys and license to a remote GitLab Docker host
        type: boolean
        default: false
      gitlab_host:
        description: SSH host for deployment (required when deploy is enabled)
        required: false
        default: ''
      gitlab_user:
        description: SSH user on the GitLab server
        required: false
        default: root
      gitlab_ssh_port:
        description: SSH port on the GitLab server
        required: false
        default: '22'
      gitlab_container_name:
        description: Docker container name for the GitLab instance
        required: false
        default: gitlab
      gitlab_api_url:
        description: Optional GitLab base URL used to POST the license through the API
        required: false
        default: ''
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 1 * * *"

jobs:
  build-license:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - name: Build GitLab license
        env:
          GITLAB_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.gitlab_version || '19.3.0' }}
          LICENSE_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.license_name || 'Tim Cook' }}
          LICENSE_COMPANY: ${{ github.event_name == 'workflow_dispatch' && inputs.license_company || 'Apple Computer, Inc.' }}
          LICENSE_EMAIL: ${{ github.event_name == 'workflow_dispatch' && inputs.license_email || 'tcook@apple.com' }}
          LICENSE_PLAN: ${{ github.event_name == 'workflow_dispatch' && inputs.license_plan || 'ultimate' }}
          LICENSE_USER_COUNT: ${{ github.event_name == 'workflow_dispatch' && inputs.license_user_count || '2147483647' }}
          LICENSE_EXPIRE_YEAR: ${{ github.event_name == 'workflow_dispatch' && inputs.license_expire_year || '2500' }}
        run: |
          chmod +x src/scan.features.rb
          ./make.sh

      - name: Upload license artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gitlab-license-${{ github.event_name == 'workflow_dispatch' && inputs.gitlab_version || '19.3.0' }}
          path: |
            build/public.key
            build/result.gitlab-license
            build/license.json
            build/features.json
          if-no-files-found: error

      - name: Deploy license to GitLab Docker host
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy == true && inputs.gitlab_host != '' && secrets.GITLAB_SSH_PRIVATE_KEY != '' && secrets.GITLAB_ADMIN_TOKEN != '' }}
        env:
          GITLAB_HOST: ${{ inputs.gitlab_host }}
          GITLAB_USER: ${{ inputs.gitlab_user }}
          GITLAB_SSH_PORT: ${{ inputs.gitlab_ssh_port }}
          GITLAB_CONTAINER_NAME: ${{ inputs.gitlab_container_name }}
          GITLAB_API_URL: ${{ inputs.gitlab_api_url }}
          GITLAB_PRIVATE_TOKEN: ${{ secrets.GITLAB_ADMIN_TOKEN }}
          SSH_PRIVATE_KEY: ${{ secrets.GITLAB_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H -p "${GITLAB_SSH_PORT}" "${GITLAB_HOST}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          bash ./scripts/deploy_gitlab_license.sh build/public.key build/result.gitlab-license
