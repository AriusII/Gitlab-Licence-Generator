# Example: a plain GitLab EE 19.3 server, wired up to accept a license generated by this
# repository's tool. This file is NOT the license generator itself (see docker-compose.yml at the
# repository root for that) — it is only a reference for how to plug the generator's output
# (./keys/public.key and the .gitlab-license file) into your own GitLab deployment.
#
# Required before starting:
#   1. Generate a license first: `docker compose up` at the repository root (see README.md).
#   2. export GITLAB_HOME=/srv/gitlab
#   3. mkdir -p "$GITLAB_HOME/config" "$GITLAB_HOME/logs" "$GITLAB_HOME/data"

services:
  gitlab:
    image: gitlab/gitlab-ee:19.3.0-ee.0
    container_name: gitlab
    restart: always
    hostname: gitlab.example.com
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'https://gitlab.example.com'
        # Optional hardening examples:
        # gitlab_rails['usage_ping_enabled'] = false
        # gitlab_rails['gitlab_default_projects_features_issues'] = true
    ports:
      - '80:80'
      - '443:443'
      - '22:22'
    volumes:
      - '$GITLAB_HOME/config:/etc/gitlab'
      - '$GITLAB_HOME/logs:/var/log/gitlab'
      - '$GITLAB_HOME/data:/var/opt/gitlab'
      # Overrides GitLab's built-in license encryption public key with the one this repository's
      # generator produced, so a license it signs is accepted by this instance.
      - '../keys/public.key:/opt/gitlab/embedded/service/gitlab-rails/.license_encryption_key.pub:ro'
    shm_size: '256m'
